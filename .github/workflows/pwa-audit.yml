name: AUREON Task PWA Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -s index.html
          test -s app.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon-192.png
          test -s icon-512.png
          test -s icon-maskable-512.png
          python - <<'PY'
          import json
          m=json.load(open('manifest.webmanifest'))
          assert m['display'] == 'standalone'
          assert m['start_url']
          assert m['name'] and m['short_name']
          icons=m.get('icons',[])
          assert any(i.get('sizes')=='192x192' for i in icons)
          assert any(i.get('sizes')=='512x512' for i in icons)
          assert any('maskable' in i.get('purpose','') for i in icons)
          PY
      - name: Validate Captação meeting summary contract
        run: node tests/captacao-summary-contract.test.js
      - name: Validate Setembro X paste import contract
        run: node tests/captacao-import-contract.test.js
      - name: Validate Setembro X snapshot contract
        run: node tests/captacao-september-snapshot-contract.test.js
      - name: Validate meeting readiness contract
        run: node tests/captacao-readiness-contract.test.js
      - name: Validate service worker safety
        run: |
          python - <<'PY'
          import re
          sw=open('sw.js', encoding='utf-8').read()
          app=open('app.html', encoding='utf-8').read()
          cache=re.search(r"CACHE=CACHE_PREFIX\+'(v[^']+)'", sw)
          assert cache, 'service worker cache version missing'
          assert "serviceWorker.register('./sw.js')" in app, 'Task app must register service worker'
          assert './captacao.html' in sw and './captacao-resumo.html' in sw, 'meeting pages must be cached'
          assert "req.mode==='navigate'" in sw, 'navigation fallback missing'
          assert 'SHELL_URLS' in sw, 'shell allowlist missing'
          PY
          grep -q "captacao-resumo.html" sw.js

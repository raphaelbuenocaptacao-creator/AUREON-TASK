name: AUREON Task PWA Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon-192.png
          test -s icon-512.png
          test -s icon-maskable-512.png
          python - <<'PY'
          import json
          m=json.load(open('manifest.webmanifest'))
          assert m['display'] == 'standalone'
          assert m['start_url']
          assert m['name'] and m['short_name']
          icons=m.get('icons',[])
          assert any(i.get('sizes')=='192x192' for i in icons)
          assert any(i.get('sizes')=='512x512' for i in icons)
          assert any('maskable' in i.get('purpose','') for i in icons)
          PY
      - name: Validate service worker safety and semantic version alignment
        run: |
          python - <<'PY'
          import re
          sw=open('sw.js', encoding='utf-8').read()
          html=open('index.html', encoding='utf-8').read()
          cache=re.search(r"CACHE=CACHE_PREFIX\+'(v[^']+)'", sw)
          reg=re.search(r"sw\.js\?v=([^'\"]+)", html)
          assert cache and reg, 'service worker/cache version missing'
          cache_version=cache.group(1)
          registered_version=reg.group(1)
          assert registered_version == cache_version.removeprefix('v'), (cache_version, registered_version)
          PY
          grep -q "updateViaCache:'none'" index.html
          grep -q "authorization" sw.js
          grep -q "cookie" sw.js
          grep -q "if-range" sw.js
          grep -q "no-store" sw.js
          grep -q "set-cookie" sw.js
          grep -q "content-range" sw.js
          grep -q "v==='range'" sw.js
          grep -q "v==='if-range'" sw.js
          grep -q "request.mode==='navigate'" sw.js
          grep -q "isShellAsset" sw.js
